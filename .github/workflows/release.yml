name: Release

# Manual only. Releases are normally cut locally with `goreleaser release`
# (which has a token that can push to the tap). Auto-running on tag push would
# double-create the release and fail here without a HOMEBREW_TAP_GITHUB_TOKEN
# secret (a PAT with `repo` scope on the homebrew-airtone tap repo).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
