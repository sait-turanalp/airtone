name: Release

# Auto-releases on a v* tag (and can be run manually). Pushing the binaries +
# updating the Homebrew tap both work because the repo provides a
# HOMEBREW_TAP_GITHUB_TOKEN secret with push access to the homebrew-airtone repo.
# Release ONLY via this workflow — do not also run `goreleaser release` locally,
# or you get a duplicate release for the same tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
