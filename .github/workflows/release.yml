name: Release

# Cuts a release and updates the Homebrew tap when a v* tag is pushed.
# Requires repo secret HOMEBREW_TAP_GITHUB_TOKEN — a PAT with `repo` scope on
# the homebrew-airtone tap repo (the default GITHUB_TOKEN cannot push cross-repo).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
