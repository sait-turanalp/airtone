name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
            shellcheck scripts/*.sh
          else
            echo "no scripts yet — skipping"
          fi
