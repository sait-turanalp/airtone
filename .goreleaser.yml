version: 2
project_name: airtone

before:
  hooks:
    - go mod tidy

builds:
  - id: airtone
    main: ./cmd/airtone
    binary: airtone
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: airtone
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: airtone
    repository:
      owner: sait-turanalp
      name: homebrew-airtone
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sait-turanalp/airtone"
    description: "Stream your Mac's system audio to your phone in sync — gapless, no app required."
    license: GPL-3.0
    dependencies:
      - name: snapcast
      - name: ffmpeg
    caveats: |
      AirTone captures system audio with a CoreAudio process tap, so it needs
      macOS 14.2 or newer and the Xcode command line tools (the tap is compiled
      once during setup):

        xcode-select --install

      Then run:  airtone setup

release:
  github:
    owner: sait-turanalp
    name: airtone
  prerelease: auto

changelog:
  use: github
  sort: asc
