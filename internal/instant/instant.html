<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AirTone — Instant</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.2rem;
    background: #0f1117; color: #e6e6e6;
    font-family: -apple-system, system-ui, sans-serif; text-align: center;
  }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
  .sub { color: #8b93a7; font-size: .9rem; margin-top: -.6rem; }
  button {
    appearance: none; border: 0; border-radius: 999px;
    padding: 1.1rem 2.4rem; font-size: 1.2rem; font-weight: 600;
    background: #5b6cff; color: white; cursor: pointer;
  }
  button:active { transform: scale(.98); }
  #status { color: #8b93a7; font-size: .95rem; min-height: 1.2em; }
  .live { color: #36d399 !important; font-weight: 600; }
</style>
</head>
<body>
  <h1>AirTone</h1>
  <div class="sub">low-latency · instant mode</div>
  <button id="play">▶ Tap to listen</button>
  <div id="status">tap to connect</div>
  <div id="stats" class="sub" style="margin-top:.3rem; font-variant-numeric: tabular-nums;"></div>
  <audio id="audio" autoplay playsinline></audio>

<script>
const btn = document.getElementById('play');
const audio = document.getElementById('audio');
const status = document.getElementById('status');
const statsEl = document.getElementById('stats');

// Live latency readout via getStats: network RTT + jitter-buffer delay.
function startStats(pc) {
  let prevDelay = 0, prevCount = 0;
  setInterval(async () => {
    let rtt = null, jb = null;
    (await pc.getStats()).forEach(r => {
      if (r.type === 'candidate-pair' && r.nominated && r.currentRoundTripTime != null) {
        rtt = r.currentRoundTripTime * 1000;
      }
      if (r.type === 'inbound-rtp' && r.kind === 'audio' && r.jitterBufferEmittedCount != null) {
        const dD = r.jitterBufferDelay - prevDelay;
        const dC = r.jitterBufferEmittedCount - prevCount;
        if (dC > 0) jb = (dD / dC) * 1000;
        prevDelay = r.jitterBufferDelay; prevCount = r.jitterBufferEmittedCount;
      }
    });
    const oneWay = (rtt ? rtt / 2 : 0) + (jb || 0);
    const f = x => x == null ? '–' : x.toFixed(0);
    statsEl.textContent = `net ${f(rtt)}ms RTT · buffer ${f(jb)}ms · ~${f(oneWay)}ms one-way`;
  }, 1000);
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  status.textContent = 'connecting…';
  try {
    const pc = new RTCPeerConnection();
    pc.addTransceiver('audio', { direction: 'recvonly' });

    pc.ontrack = (e) => {
      audio.srcObject = e.streams[0];
      audio.play().catch(() => {});
      // Push the jitter buffer / playout delay as low as the browser allows.
      pc.getReceivers().forEach(r => {
        if ('playoutDelayHint' in r) r.playoutDelayHint = 0;
        if ('jitterBufferTarget' in r) r.jitterBufferTarget = 80;
      });
      status.textContent = '● LIVE';
      status.classList.add('live');
      btn.style.display = 'none';
      startStats(pc);
    };

    pc.onconnectionstatechange = () => {
      if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
        status.textContent = 'disconnected — reload to retry';
        status.classList.remove('live');
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const res = await fetch('/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pc.localDescription),
    });
    if (!res.ok) throw new Error('server ' + res.status);
    await pc.setRemoteDescription(await res.json());
  } catch (err) {
    status.textContent = 'error: ' + err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
